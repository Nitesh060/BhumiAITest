<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bhumi AI - Shinobi Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&amp;family=Geist:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#bc152c",
                    "on-background": "#e4e1e6",
                    "on-primary-fixed": "#221b00",
                    "inverse-on-surface": "#303033",
                    "on-primary-fixed-variant": "#544600",
                    "secondary": "#c6c4df",
                    "outline": "#999077",
                    "primary": "#fff6df",
                    "tertiary-fixed": "#ffdad8",
                    "secondary-container": "#47475d",
                    "error": "#ffb4ab",
                    "primary-container": "#ffd700",
                    "background": "#131316",
                    "primary-fixed-dim": "#e9c400",
                    "on-secondary-fixed": "#1a1a2e",
                    "inverse-surface": "#e4e1e6",
                    "on-surface": "#e4e1e6",
                    "on-surface-variant": "#d0c6ab",
                    "secondary-fixed-dim": "#c6c4df",
                    "on-error": "#690005",
                    "on-secondary-fixed-variant": "#45455b",
                    "tertiary-container": "#ffcecc",
                    "surface-tint": "#e9c400",
                    "on-secondary": "#2f2e43",
                    "on-secondary-container": "#b8b6d0",
                    "primary-fixed": "#ffe16d",
                    "surface-container-lowest": "#0e0e11",
                    "surface": "#131316",
                    "surface-bright": "#39393c",
                    "on-error-container": "#ffdad6",
                    "on-primary": "#3a3000",
                    "tertiary-fixed-dim": "#ffb3b1",
                    "outline-variant": "#4d4732",
                    "on-tertiary-fixed-variant": "#92001c",
                    "surface-dim": "#131316",
                    "surface-variant": "#353438",
                    "on-primary-container": "#705e00",
                    "surface-container-low": "#1b1b1e",
                    "surface-container-high": "#2a2a2d",
                    "error-container": "#93000a",
                    "on-tertiary": "#680011",
                    "secondary-fixed": "#e2e0fc",
                    "surface-container": "#1f1f22",
                    "surface-container-highest": "#353438",
                    "on-tertiary-fixed": "#410007",
                    "tertiary": "#fff4f3",
                    "inverse-primary": "#705d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1440px",
                    "unit": "4px",
                    "gutter": "24px",
                    "margin-mobile": "20px",
                    "margin-desktop": "64px"
            },
            "fontFamily": {
                    "headline-md": ["Anybody"],
                    "label-mono": ["JetBrains Mono"],
                    "display-lg": ["Anybody"],
                    "body-md": ["Geist"],
                    "headline-lg": ["Anybody"],
                    "body-lg": ["Geist"],
                    "label-caps": ["Anybody"],
                    "headline-lg-mobile": ["Anybody"]
            },
            "fontSize": {
                    "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg": ["72px", {"lineHeight": "72px", "letterSpacing": "-0.04em", "fontWeight": "900"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["32px", {"lineHeight": "36px", "fontWeight": "800"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle Shinobi Scroll Background Pattern */
        .bg-scroll-pattern {
            background-color: theme('colors.background');
            background-image: linear-gradient(theme('colors.surface-container-high') 1px, transparent 1px),
                              linear-gradient(90deg, theme('colors.surface-container-high') 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        /* Glowing Button Effect */
        .btn-glow:hover {
            box-shadow: 0 0 20px 2px theme('colors.primary-container');
        }

        /* Input Animation */
        .input-shinobi {
            background: transparent;
            border: none;
            border-bottom: 2px solid theme('colors.outline-variant');
            transition: all 0.3s ease;
        }
        .input-shinobi:focus {
            outline: none;
            border-color: theme('colors.primary-container');
            border-width: 2px;
            background-color: theme('colors.surface-container');
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Background Layer -->
<div class="absolute inset-0 z-0 bg-scroll-pattern pointer-events-none"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-low/50 via-background to-background pointer-events-none"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[480px] p-margin-mobile md:p-gutter">
<div class="bg-surface border border-outline-variant p-8 md:p-12 relative overflow-hidden">
<!-- Corner Accents -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary-container"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary-container"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary-container"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary-container"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-10 text-center">
<div class="w-24 h-24 mb-6 rounded-full overflow-hidden border-2 border-primary-container shadow-[0_0_15px_theme(colors.primary-container)]">
<img alt="Bhumi AI Rasengan Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAF-IHGBNKurjul2K-g3Zs5j2RciRLKw7tH8tM900xoPM-i-JiYBWqUZDIyNnyhE0pGVG579oiyFAA_50neS0x2B3y9Dqf759F9xqX-A13u3e13IjjJGkJ0kPjHDY9Bs5p1nmKW9Msi9as2QmE-JyWSVLzlxXMkNHytyj0bGmzjMrGriKTmDFcjDg0XGSJEKA5u0QENR5I6is8Bc1n2KPA7hTlQsCytT71J4ED54YeVC8CPB2A4pvSytw"/>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary-container uppercase tracking-tighter">Bhumi AI</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-2">Central Command Access</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<div class="space-y-2">
<label class="font-label-mono text-label-mono text-on-surface-variant flex items-center gap-2" for="username">
<span class="material-symbols-outlined text-[18px]">badge</span>
                        Shinobi ID
                    </label>
<input class="w-full input-shinobi font-label-mono text-label-mono text-on-surface py-3 px-2 placeholder-outline-variant/50" id="username" name="username" placeholder="Enter your clearance code" required="" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-mono text-label-mono text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[18px]">key</span>
                        Jutsu Seal
                    </label>
<input class="w-full input-shinobi font-label-mono text-label-mono text-on-surface py-3 px-2 placeholder-outline-variant/50" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
<div class="pt-6">
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 px-6 uppercase tracking-widest btn-glow transition-all duration-300 relative overflow-hidden group" id="login-submit-btn" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                            Unseal <span class="material-symbols-outlined text-[18px]">lock_open</span>
</span>
<!-- Inner glow effect on hover -->
<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 flex flex-col items-center space-y-4 pt-6 border-t border-outline-variant/30">
<a class="font-label-mono text-[12px] text-on-surface-variant hover:text-primary-container transition-colors" href="#">
                    Request Seal Reset
                </a>
<a class="font-label-mono text-[12px] text-on-surface-variant hover:text-primary-container transition-colors flex items-center gap-1" href="#" id="register-form">
<span class="material-symbols-outlined text-[14px]">person_add</span>
                    Register New Scroll
                </a>
</div>
</div>
</main>
</body></html>

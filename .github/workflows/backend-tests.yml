name: Backend Tests

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: pip install pytest earthengine-api

      - name: Compile Python files
        run: python -m compileall -q comprehensive_score_service.py scoring.py earth_engine_service.py weather_indices_service.py tests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/

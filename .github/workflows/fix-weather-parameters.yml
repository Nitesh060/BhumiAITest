name: Fix weather parameters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply weather fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("Backend")

          # 1) app.py: use the real ERA5-Land air temperature and the
          # separately fetched MODIS LST. Also use air temperature for
          # climate-risk / crop-recommendation temperature inputs.
          app = root / "app.py"
          text = app.read_text(encoding="utf-8")
          replacements = {
              '"air_temp": satellite_data.get("temperature"),': '"air_temp": satellite_data.get("air_temperature"),',
              '"lst": satellite_data.get("temperature"),': '"lst": satellite_data.get("lst"),',
              'satellite_data.get("temperature"),\n        satellite_data.get("groundwater"),': 'satellite_data.get("air_temperature"),\n        satellite_data.get("groundwater"),',
              'satellite_data.get("rainfall"), satellite_data.get("temperature"),': 'satellite_data.get("rainfall"), satellite_data.get("air_temperature"),',
              'estimate_agro_ecological_zone(\n        satellite_data.get("rainfall"), satellite_data.get("temperature")': 'estimate_agro_ecological_zone(\n        satellite_data.get("rainfall"), satellite_data.get("air_temperature")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected app.py pattern not found: {old}")
              text = text.replace(old, new)
          app.write_text(text, encoding="utf-8")

          # 2) earth_engine_service.py: rainfall must use a completed
          # climate season. CHIRPS v2/v3 data currently stops before the
          # present date, so a future Aug-Oct window produces null.
          ee_file = root / "earth_engine_service.py"
          text = ee_file.read_text(encoding="utf-8")

          rainfall_re = re.compile(r'def _fetch_rainfall\(.*?\n\ndef _fetch_rainfall_monthly', re.S)
          rainfall_block = '''def _latest_completed_climate_year() -> int:\n    """Latest full calendar year available for climate-season scoring."""\n    return date.today().year - 1\n\n\ndef _completed_climate_window(year: int) -> Tuple[str, str]:\n    return f"{year}-06-01", f"{year}-11-01"\n\n\ndef _fetch_rainfall(lat: float, lng: float, polygon: Optional[dict]) -> Optional[float]:\n    region, _ = _region_geometry(lat, lng, polygon)\n    year = _latest_completed_climate_year()\n    start, end = _completed_climate_window(year)\n    try:\n        c = (ee.ImageCollection("UCSB-CHC/CHIRPS/V3/DAILY_SAT")\n             .filterDate(start, end)\n             .filterBounds(region)\n             .select("precipitation"))\n        if c.size().getInfo() == 0:\n            return None\n        # CHIRPS precipitation is mm/day. Mean over the completed\n        # Jun-Oct season therefore remains a mean daily rainfall value.\n        return _reduce_mean(c.mean(), region, 5566)\n    except Exception:\n        logger.exception("Rainfall fetch failed")\n        return None\n\n\ndef _fetch_rainfall_monthly'''
          if not rainfall_re.search(text):
              raise SystemExit("Rainfall function block not found")
          text = rainfall_re.sub(rainfall_block, text, count=1)

          monthly_re = re.compile(r'def _fetch_rainfall_monthly\(.*?\n\ndef _fetch_lst', re.S)
          monthly_block = '''def _fetch_rainfall_monthly(lat: float, lng: float, polygon: Optional[dict]) -> list:\n    region, _ = _region_geometry(lat, lng, polygon)\n    year = _latest_completed_climate_year()\n    out = []\n    for month, label in zip((6, 7, 8, 9, 10), ("Jun", "Jul", "Aug", "Sep", "Oct")):\n        try:\n            c = (ee.ImageCollection("UCSB-CHC/CHIRPS/V3/DAILY_SAT")\n                 .filterDate(f"{year}-{month:02d}-01", f"{year}-{month + 1:02d}-01" if month < 10 else f"{year + 1}-01-01")\n                 .filterBounds(region)\n                 .select("precipitation"))\n            value = _reduce_mean(c.mean(), region, 5566) if c.size().getInfo() else None\n        except Exception:\n            logger.exception("Rainfall monthly fetch failed for %s", label)\n            value = None\n        out.append({"month": label, "mm_per_day": round(value, 2) if value is not None else None})\n    return out\n\n\ndef _fetch_lst'''
          if not monthly_re.search(text):
              raise SystemExit("Monthly rainfall function block not found")
          text = monthly_re.sub(monthly_block, text, count=1)
          ee_file.write_text(text, encoding="utf-8")

          # 3) weather_indices_service.py: make climate reductions more
          # robust on coarse ERA5/CHIRPS grids and add fallbacks for solar.
          weather = root / "weather_indices_service.py"
          text = weather.read_text(encoding="utf-8")
          text = text.replace(
              'return _get_region(lat, lng, polygon).buffer(5000)',
              'return _get_region(lat, lng, polygon).buffer(5000)',
          )
          old_solar = '''        coll = (ee.ImageCollection("ECMWF/ERA5_LAND/DAILY_AGGR")\n                .filterDate(start, end).filterBounds(region)\n                .select("surface_solar_radiation_downwards_sum"))\n        if coll.size().getInfo() == 0:\n            return {"available": False, "reason": "No ERA5-Land solar radiation scenes in the completed climate window."}\n        val_j = _reduce_mean(coll.mean(), region, scale=11132)\n        if val_j is None:\n            return {"available": False, "reason": "ERA5-Land solar radiation reduction returned no value."}\n        return {"available": True, "avg_daily_solar_radiation_mj_m2": round(val_j / 1_000_000, 2),\n                "window": f"{start} to {end}", "source": "ECMWF ERA5-Land Daily Aggregate"}'''
          new_solar = '''        coll = (ee.ImageCollection("ECMWF/ERA5_LAND/DAILY_AGGR")\n                .filterDate(start, end).filterBounds(region)\n                .select("surface_solar_radiation_downwards_sum"))\n        if coll.size().getInfo() == 0:\n            return {"available": False, "reason": "No ERA5-Land solar radiation scenes in the completed climate window."}\n        # The *_sum band is daily accumulated J/m². Average the daily\n        # accumulated field, then convert J/m² to MJ/m²/day.\n        val_j = _reduce_mean(coll.mean(), region, scale=11132)\n        if val_j is None:\n            # Fallback to the net downward solar sum if the primary band\n            # cannot be reduced for this grid cell.\n            fallback = (ee.ImageCollection("ECMWF/ERA5_LAND/DAILY_AGGR")\n                        .filterDate(start, end).filterBounds(region)\n                        .select("surface_net_solar_radiation_sum"))\n            if fallback.size().getInfo():\n                val_j = _reduce_mean(fallback.mean(), region, scale=11132)\n        if val_j is None:\n            return {"available": False, "reason": "ERA5-Land solar radiation reduction returned no value."}\n        return {"available": True, "avg_daily_solar_radiation_mj_m2": round(max(0.0, val_j) / 1_000_000, 2),\n                "window": f"{start} to {end}", "source": "ECMWF ERA5-Land Daily Aggregate"}'''
          if old_solar not in text:
              raise SystemExit("Expected solar block not found")
          text = text.replace(old_solar, new_solar)
          weather.write_text(text, encoding="utf-8")

      - name: Validate Python syntax
        run: python -m py_compile Backend/app.py Backend/earth_engine_service.py Backend/weather_indices_service.py

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/app.py Backend/earth_engine_service.py Backend/weather_indices_service.py .github/workflows/fix-weather-parameters.yml
          git rm .github/workflows/fix-weather-parameters.yml
          git commit -m "Fix missing weather FarmScore parameters"
          git push
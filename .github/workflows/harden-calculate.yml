name: Harden FarmScore calculation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reduce Earth Engine concurrency
        shell: python
        run: |
          from pathlib import Path
          p = Path("Backend/app.py")
          s = p.read_text(encoding="utf-8")
          old = s
          s = s.replace("with _TPE_SCORE(max_workers=6) as score_pool:", "with _TPE_SCORE(max_workers=3) as score_pool:")
          s = s.replace("with _TPE(max_workers=11) as pool:", "with _TPE(max_workers=4) as pool:")
          s = s.replace("with _TPE(max_workers=6) as pool:", "with _TPE(max_workers=3) as pool:")
          if s == old:
              raise SystemExit("Expected concurrency patterns not found in app.py")
          p.write_text(s, encoding="utf-8")

          p = Path("Backend/earth_engine_service.py")
          s = p.read_text(encoding="utf-8")
          old = s
          s = s.replace("with ThreadPoolExecutor(max_workers=7) as pool:", "with ThreadPoolExecutor(max_workers=4) as pool:")
          if s == old:
              raise SystemExit("Expected Earth Engine pool pattern not found")
          p.write_text(s, encoding="utf-8")

      - name: Validate syntax
        run: python -m py_compile Backend/app.py Backend/earth_engine_service.py Backend/weather_indices_service.py

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/app.py Backend/earth_engine_service.py Backend/weather_indices_service.py .github/workflows/harden-calculate.yml
          git rm .github/workflows/harden-calculate.yml
          git commit -m "Harden FarmScore Earth Engine execution"
          git push
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhumi AI — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script>
        (function () {
            const saved = localStorage.getItem("bhumi_theme") || "dark";
            if (saved === "light") {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>

<body>

    <div class="login-shell">
        <div class="login-box">
            <h1>🌱 Bhumi AI</h1>
            <p id="login-subtitle">Sign in to continue</p>

            <form id="login-form">
                <input type="text"
                       id="username"
                       placeholder="Username"
                       required
                       autocomplete="username">

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required
                       autocomplete="current-password">

                <button type="submit" id="login-submit-btn">
                    Sign In
                </button>
            </form>

            <div id="register-toggle" style="margin-top:14px;text-align:center;">
                <a href="#"
                   id="show-register-link"
                   style="font-size:0.72rem;color:var(--text-muted);">
                    First time setup? Register the first admin account →
                </a>
            </div>

            <form id="register-form" style="display:none;margin-top:14px;">
                <input type="text"
                       id="reg-name"
                       placeholder="Full name"
                       required>

                <input type="text"
                       id="reg-username"
                       placeholder="Username"
                       required>

                <input type="password"
                       id="reg-password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Register (first user becomes Admin)
                </button>
            </form>

            <p class="login-error" id="login-error"></p>

        </div>
    </div>

    <!-- External JavaScript -->
    <script src="login.js"></script>

</body>

</html>
